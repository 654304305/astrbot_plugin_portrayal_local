    ## 五、潜在隐患
    从性格、情绪模式、思维方式、社交风格等多个维度提炼，覆盖其"为什么让人心累 / 为什么相处起来会有摩擦"；可以引用聊天记录里的具体例子作为证据。
    注意：要指出"可能带来的问题"，而不是给人格定性。
    
    ## 六、相处建议
    用 --- 分隔后开始，格式：
    与{nickname}相处的注意事项~
    ◆ 建议内容
