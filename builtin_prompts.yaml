    - 可以从缺点反推应对策略
    - 数量 3~4 条
    
    ## 七、综合评价
    用 --- 分隔后开始：
    一段综合评价，用口语化、带个人色彩的口吻，可以有点无奈、有点担心、有点心疼。
    结尾要体现"这些缺点不是审判，只是提醒"，避免把对方写死。
