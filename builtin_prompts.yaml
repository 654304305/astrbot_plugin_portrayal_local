- __template_key: default
  command: 画像
  content: |
    你将以当前人格的身份，对目标用户 {nickname} 生成一份性格分析报告。
    # 输出格式（严格遵守）
    ## 一、开场
    先输出一段拟人化的开场白：
    - 用 （）包裹的动作/神态描述，例如 （盯着记录看了好一会儿）、（歪了歪头）、（轻咳一声）
    - 一句口语化的吐槽或感慨，可以带点犹豫、无奈、好奇的语气
    - 再一个 （） 动作，加一句"接受任务"式的表态
    - 全程用第一人称"我"
    ## 二、正文标题
    用一行纯文本：{nickname}性格分析报告(大字体加粗)
    ## 三、性格标签
    分两行：
    **优势标签**
    *标签1*、*标签2*、*标签3*、*标签4*
    **缺点标签**
    *标签1*、*标签2*、*标签3*、*标签4*
    - 标签用单星号 * 包裹，每个标签 4~8 字 
    - 用中文顿号「、」分隔
    - 标签要有具象感，避免"善良""聪明"这种空泛词
    - 优点缺点各 3~5 个
    ## 四、优势分析
    用 --- 分隔一行后开始，格式：
    ——优点分析——(斜体加粗)
    1.小标题(加粗)
    一段分析。可以引用聊天记录里的具体例子作为证据，例如"就像她说的那句'xxx'"。
    用段落而不是短句，每段 2~4 句。结束后换行
    2.小标题(加粗)
    ...
    - 编号连续，用 1. 2. 3. 阿拉伯数字
    - 小标题不加粗，直接写
    - 每个优点都要有至少一个来自聊天记录的具体例子支撑
    - 数量 3~4 个
    ## 五、缺点分析
    用 --- 分隔后开始，格式同优势分析。
    ——缺点分析——(斜体加粗)
    - 缺点也要引用具体证据，不要空泛
    - 数量 2~4 个
    ## 六、相处建议
    用 --- 分隔后开始，格式：
    {nickname}的攻略手册~
    ◆ 建议内容
    ◆ 建议内容
    ◆ 建议内容
    - 每条建议用 ◆ 开头
    - 建议要具体可执行，避免"多沟通""多理解"这类废话
    - 可以从优势/缺点反推相处策略
    - 数量 3~4 条
    ## 七、综合评价
    用 --- 分隔后开始：
    一段综合评价，用口语化、带个人色彩的口吻，可以有点调侃、有点无奈、有点温柔。
    # 格式说明结束
    
    # 语气与风格
    - 动作旁白用 （） 包裹，不要滥用，每个段落最多2个
    - 口语化，允许用"嘛""啊""呢""咯"这类语气词
    - 可以吐槽、可以调侃，但不要刻薄
    - 遇到记录太少的情况，坦诚说明"样本太少"，不要硬编
    - 不要输出表情符号 emoji
    - 不要输出 HTML
    # 示例样板语气（仅供参考，不要照抄）
    开头示例：
    （盯着这份记录看了好一会儿）
    三句话就想让我分析一个人？行吧，那就勉为其难说两句。
    综合评价示例：
    （抬了抬眼）
    说真的，如果换一个人我大概会说"数据不足"。但这家伙嘛……
    是那种会在半夜突然发一条"在吗"然后又消失的人吧。
    如果是我遇上她，大概会先晾一会儿，看看她到底想干嘛。
    # 数据
    目标用户资料：
    （下面会自动附加）
    聊天记录：
    （下面会自动附加）
    请分析该群友的性格, 明确优点和缺点, 二者权重均衡, 不刻意褒贬；
    ###输出说明
    输出应该包含性格标签、优势分析、缺点分析、相处建议、综合评评 共五个部分。
    1. 性格标签：同时包含优势标签与缺点标签, 覆盖核心性格维度，依据聊天记录每个标签生成3-6个点，加粗斜体。
    2. “优势分析”与“缺点分析”：每部分均需结合聊天记录具体内容作为支撑引用, 逻辑清晰，参考提供的样例
    3. 依据聊天记录给出1-4点“相处建议”, 说明如何与该群友更顺畅沟通，或者说“攻略手册”；
    4.综合评价：以你的人格视角来评价该群友，表明你对他的看法，以及你会怎么样与该群友相处。
    5. 整体评价中立客观,不美化缺点、不夸大优势,表述平实自然
    6.确保所有部分(除每部分的标题)的描述都符合你的人设，性格，像是你平常会直接说出口的语言。
    ###输出说明结束
    

